name: Garud CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Garud
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Create CI environment
        run: |
          touch .env

      - name: Build Garud containers
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build

      - name: Start Garud
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

      - name: Show container status
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps

      - name: Wait for Garud
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:80/ > /dev/null; then
              echo "Garud is ready"
              exit 0
            fi

            echo "Waiting for Garud... attempt $i/30"
            sleep 2
          done

          echo "Garud did not become ready"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs
          exit 1

      - name: Test HTTP endpoints
        run: |
          echo "Testing home..."
          curl -i http://127.0.0.1:80/

          echo "Testing Jarvis..."
          curl -i http://127.0.0.1:80/jarvis

      - name: Run Garud tests
        run: |
          pytest -vv -s test_app.py

      - name: Install Trivy
        uses: aquasecurity/trivy-action@0.33.1

      - name: Scan Garud perimeter image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            garud-perimeter

      - name: Scan Garud shield image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            garud-shield

      - name: Show logs on failure
        if: failure()
        run: |
          echo "===== CONTAINER STATUS ====="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps

          echo "===== GARUD LOGS ====="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color

      - name: Stop Garud
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down
