name: Garud CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Garud
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Create CI environment
        run: |
          touch .env

      - name: Build Garud containers
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build

      - name: Show Docker images
        run: |
          docker images

      - name: Tag Garud images for Trivy
        run: |
          set -e
          for svc in perimeter shield; do
            IMG=$(docker images --format '{{.Repository}}:{{.Tag}}' \
              | grep -i "$svc" | grep -v '^garud-' | head -n1 || true)

            if [ -z "$IMG" ]; then
              # already named garud-<svc>:latest ho to theek hai
              if docker image inspect "garud-$svc:latest" > /dev/null 2>&1; then
                echo "garud-$svc:latest already exists"
                continue
              fi
              echo "ERROR: image for '$svc' not found"
              docker images
              exit 1
            fi

            echo "Tagging $IMG -> garud-$svc:latest"
            docker tag "$IMG" "garud-$svc:latest"
          done

          docker images | grep garud-

      - name: Start Garud
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d

      - name: Show container status
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps

      - name: Wait for Garud
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:80/ > /dev/null; then
              echo "Garud is ready"
              exit 0
            fi

            echo "Waiting for Garud... attempt $i/30"
            sleep 2
          done

          echo "Garud did not become ready"

          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

          exit 1

      - name: Test HTTP endpoints
        run: |
          echo "Testing home..."
          curl -i http://127.0.0.1:80/

          echo "Testing Garud..."
          curl -i http://127.0.0.1:80/garud

      - name: Run Garud tests
        run: |
          pytest -vv -s test_app.py

      - name: Scan Garud perimeter image
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        with:
          image-ref: 'garud-perimeter:latest'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan Garud shield image
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
        with:
          image-ref: 'garud-shield:latest'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'

      - name: Show logs on failure
        if: failure()
        run: |
          echo "===== CONTAINER STATUS ====="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps

          echo "===== GARUD LOGS ====="
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color

      - name: Stop Garud
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down
